name: AIPS Cloudflare Deploy

# Deploys the governed build to Cloudflare Workers (static assets) on push to
# main. Requires two repository secrets (set by the owner):
#   CLOUDFLARE_API_TOKEN  — Workers Edit scope, account-level
#   CLOUDFLARE_ACCOUNT_ID — account id (already present per ops/harness)

on:
  push:
    branches: [main]
    paths:
      - "artifacts/aips-landing/**"
      - "functions/**"
      - "worker/**"
      - "scripts/prepare-cloudflare.mjs"
      - "ops/ssot/**"
      - "wrangler.toml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/aips-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build public site (governed pipeline)
        working-directory: artifacts/aips-landing
        env:
          PORT: "3000"
          BASE_PATH: "/"
          # Public measurement IDs (not secrets), set by the owner under
          # Settings > Secrets and variables > Actions > Variables. When a
          # variable is unset the value is empty and that tag never loads.
          # Both tags stay behind the visitor's cookie consent in the app.
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_FB_PIXEL_ID: ${{ vars.VITE_FB_PIXEL_ID }}
        run: pnpm run build

      - name: Prepare Cloudflare artifact
        run: node scripts/prepare-cloudflare.mjs

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy

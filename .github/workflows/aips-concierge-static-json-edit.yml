name: AIPS concierge static JSON import experiment

on:
  push:
    branches:
      - aips/concierge-static-json-imports-20260908

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace runtime file URL reads with static JSON imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          concierge = Path('artifacts/aips-landing/api/concierge.js')
          text = concierge.read_text()
          old_fs = 'import { readFileSync } from "node:fs";\n'
          old_loader = 'const readAdjacentJson = (name) => JSON.parse(readFileSync(new URL(name, import.meta.url), "utf8"));\nconst catalog = readAdjacentJson("./_catalog.json");\nconst policy = readAdjacentJson("./_policy.json");'
          new_imports = 'import catalog from "./_catalog.json" with { type: "json" };\nimport policy from "./_policy.json" with { type: "json" };'
          if old_fs not in text or old_loader not in text:
              raise SystemExit('expected concierge JSON loader pattern not found')
          text = text.replace(old_fs, '', 1).replace(old_loader, new_imports, 1)
          concierge.write_text(text)

          knowledge = Path('artifacts/aips-landing/api/_knowledge.js')
          text = knowledge.read_text()
          start = '// Vercel\'s Node function tracer must be able to see build/runtime JSON\n'
          end = 'export const KNOWLEDGE = ['
          i = text.find(start)
          j = text.find(end)
          if i == -1 or j == -1 or j <= i:
              raise SystemExit('expected knowledge asset-trace block not found')
          replacement = '// Governed runtime JSON is statically imported by concierge.js, so Vercel\'s\n// function bundler can trace and package those assets without runtime path or\n// import.meta.url conversion here.\n\n'
          text = text[:i] + replacement + text[j:]
          knowledge.write_text(text)
          PY

          ! grep -q 'import.meta.url' artifacts/aips-landing/api/concierge.js
          ! grep -q 'readFileSync' artifacts/aips-landing/api/concierge.js
          ! grep -q 'import.meta.url' artifacts/aips-landing/api/_knowledge.js
          ! grep -q 'readFileSync' artifacts/aips-landing/api/_knowledge.js
          grep -q 'import catalog from "./_catalog.json" with { type: "json" };' artifacts/aips-landing/api/concierge.js
          grep -q 'import policy from "./_policy.json" with { type: "json" };' artifacts/aips-landing/api/concierge.js

      - name: Commit source edit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/aips-concierge-static-json-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/aips-landing/api/concierge.js artifacts/aips-landing/api/_knowledge.js .github/workflows/aips-concierge-static-json-edit.yml
          git commit -m "fix: statically import concierge runtime JSON"
          git push origin "HEAD:${GITHUB_REF_NAME}"

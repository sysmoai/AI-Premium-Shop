name: AIPS concierge validator static import edit

on:
  push:
    branches:
      - aips/concierge-static-json-imports-20260908

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require static governed JSON imports in truth validator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('artifacts/aips-landing/scripts/validate-concierge-truth.mjs')
          text = path.read_text()
          old = '''for (const required of [\n  'readAdjacentJson("./_policy.json")',\n  "assertRuntimeTruth();",'''
          new = '''for (const required of [\n  'import catalog from "./_catalog.json" with { type: "json" };',\n  'import policy from "./_policy.json" with { type: "json" };',\n  "assertRuntimeTruth();",'''
          if old not in text:
              raise SystemExit('expected concierge truth-guard pattern not found')
          text = text.replace(old, new, 1)
          anchor = '''if (/function productBlock[\\s\\S]{0,500}p\\.caps/.test(conciergeSource)) fail("model-facing productBlock still exposes unverified capability claims");'''
          addition = '''if (conciergeSource.includes("import.meta.url") || conciergeSource.includes("readFileSync(")) fail("concierge runtime must not load governed JSON through runtime URL/filesystem conversion");\nif (/function productBlock[\\s\\S]{0,500}p\\.caps/.test(conciergeSource)) fail("model-facing productBlock still exposes unverified capability claims");'''
          if anchor not in text:
              raise SystemExit('expected validator insertion anchor not found')
          text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY
          grep -q 'import policy from "./_policy.json" with { type: "json" };' artifacts/aips-landing/scripts/validate-concierge-truth.mjs
          grep -q 'runtime must not load governed JSON through runtime URL/filesystem conversion' artifacts/aips-landing/scripts/validate-concierge-truth.mjs

      - name: Commit validator edit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/aips-concierge-validator-static-import-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/aips-landing/scripts/validate-concierge-truth.mjs .github/workflows/aips-concierge-validator-static-import-edit.yml
          git commit -m "test: enforce static concierge JSON imports"
          git push origin "HEAD:${GITHUB_REF_NAME}"

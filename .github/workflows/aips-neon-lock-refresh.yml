name: AIPS Neon lock refresh

on:
  push:
    branches:
      - aips/concierge-neon-hardening-v2-20260908

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/aips-neon-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/aips-neon-lock-refresh.yml
          if git diff --cached --quiet; then
            echo "No lockfile change to commit."
            exit 0
          fi
          git commit -m "chore: refresh lockfile for Neon driver"
          git push origin "HEAD:${GITHUB_REF_NAME}"

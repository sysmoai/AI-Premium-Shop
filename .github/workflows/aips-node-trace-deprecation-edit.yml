name: AIPS Node trace deprecation edit

on:
  push:
    branches:
      - aips/concierge-node-trace-deprecation-20260908

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add temporary Node process-start trace option
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/aips-landing/vercel.json')
          data = json.loads(path.read_text())
          env = data.setdefault('env', {})
          if 'NODE_OPTIONS' in env:
              raise SystemExit('NODE_OPTIONS already configured; refusing to overwrite')
          env['NODE_OPTIONS'] = '--trace-deprecation'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/aips-landing/vercel.json').read_text())
          assert data['env']['PORT'] == '3000'
          assert data['env']['BASE_PATH'] == '/'
          assert data['env']['NODE_OPTIONS'] == '--trace-deprecation'
          assert data['functions']['api/concierge.js']['maxDuration'] == 45
          PY

      - name: Commit config edit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/aips-node-trace-deprecation-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/aips-landing/vercel.json .github/workflows/aips-node-trace-deprecation-edit.yml
          git commit -m "diag: enable Node deprecation stack traces"
          git push origin "HEAD:${GITHUB_REF_NAME}"

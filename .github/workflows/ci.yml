name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ssot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical GitHub SSOT
        run: node scripts/validate-ssot.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter='!aips-website' --filter='!@workspace/api-server' -r --if-present typecheck
      - run: pnpm --filter='!aips-website' --filter='!@workspace/api-server' -r --if-present lint

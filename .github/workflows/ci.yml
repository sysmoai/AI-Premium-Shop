name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: these jobs only check out and validate.
permissions:
  contents: read

jobs:
  ssot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate canonical GitHub SSOT
        run: node scripts/validate-ssot.mjs
      - name: Guard customer privacy in concierge logs
        run: |
          node scripts/validate-concierge-log-privacy.mjs
          node --test scripts/validate-concierge-log-privacy.test.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter='!aips-website' --filter='!@workspace/api-server' -r --if-present typecheck
      - run: pnpm --filter='!aips-website' --filter='!@workspace/api-server' -r --if-present lint

name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm run build
      - run: npm install -g wrangler
      - run: wrangler pages deploy artifacts/aips-landing/dist/public --project-name=ai-premium-shop

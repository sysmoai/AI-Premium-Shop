name: R2 Access Probe

on:
  push:
    branches:
      - upgrade/ecommerce-media-foundation-2026-08-10
    paths:
      - ".github/workflows/r2-access-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      CLOUDFLARE_R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
      CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_EMAIL: ${{ secrets.CF_EMAIL }}
    steps:
      - name: Report final alias availability without values
        shell: bash
        run: |
          check_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              echo "${name}_PRESENT=true"
            else
              echo "${name}_PRESENT=false"
            fi
          }

          check_secret "CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_ACCOUNT_ID"
          check_secret "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_API_TOKEN"
          check_secret "CLOUDFLARE_API_KEY" "$CLOUDFLARE_API_KEY"
          check_secret "CLOUDFLARE_GLOBAL_API_KEY" "$CLOUDFLARE_GLOBAL_API_KEY"
          check_secret "CLOUDFLARE_EMAIL" "$CLOUDFLARE_EMAIL"
          check_secret "CLOUDFLARE_TOKEN" "$CLOUDFLARE_TOKEN"
          check_secret "CLOUDFLARE_ZONE_ID" "$CLOUDFLARE_ZONE_ID"
          check_secret "CLOUDFLARE_ZONE_API_TOKEN" "$CLOUDFLARE_ZONE_API_TOKEN"
          check_secret "CLOUDFLARE_R2_API_TOKEN" "$CLOUDFLARE_R2_API_TOKEN"
          check_secret "CLOUDFLARE_R2_TOKEN" "$CLOUDFLARE_R2_TOKEN"
          check_secret "CLOUDFLARE_ACCESS_KEY_ID" "$CLOUDFLARE_ACCESS_KEY_ID"
          check_secret "CLOUDFLARE_SECRET_ACCESS_KEY" "$CLOUDFLARE_SECRET_ACCESS_KEY"
          check_secret "CF_API_KEY" "$CF_API_KEY"
          check_secret "CF_EMAIL" "$CF_EMAIL"

          if { [ -n "$CLOUDFLARE_API_TOKEN" ]; } || { [ -n "$CLOUDFLARE_API_KEY" ] && [ -n "$CLOUDFLARE_EMAIL" ]; } || { [ -n "$CLOUDFLARE_GLOBAL_API_KEY" ] && [ -n "$CLOUDFLARE_EMAIL" ]; } || { [ -n "$CLOUDFLARE_ZONE_API_TOKEN" ]; } || { [ -n "$CF_API_KEY" ] && [ -n "$CF_EMAIL" ]; }; then
            echo "CLOUDFLARE_MANAGEMENT_AUTH_PRESENT=true"
          else
            echo "CLOUDFLARE_MANAGEMENT_AUTH_PRESENT=false"
          fi

          if { [ -n "$CLOUDFLARE_ACCESS_KEY_ID" ] && [ -n "$CLOUDFLARE_SECRET_ACCESS_KEY" ]; } || [ -n "$CLOUDFLARE_R2_API_TOKEN" ] || [ -n "$CLOUDFLARE_R2_TOKEN" ]; then
            echo "CLOUDFLARE_R2_ALTERNATE_AUTH_PRESENT=true"
          else
            echo "CLOUDFLARE_R2_ALTERNATE_AUTH_PRESENT=false"
          fi

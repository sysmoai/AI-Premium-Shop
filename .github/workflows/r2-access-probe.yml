name: R2 Access Probe

on:
  push:
    branches:
      - upgrade/ecommerce-media-foundation-2026-08-10
    paths:
      - ".github/workflows/r2-access-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
      R2_TOKEN: ${{ secrets.R2_TOKEN }}
    steps:
      - name: Report credential availability without values
        shell: bash
        run: |
          check_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              echo "${name}_PRESENT=true"
            else
              echo "${name}_PRESENT=false"
            fi
          }

          check_secret "R2_ACCOUNT_ID" "$R2_ACCOUNT_ID"
          check_secret "R2_ACCESS_KEY_ID" "$R2_ACCESS_KEY_ID"
          check_secret "R2_SECRET_ACCESS_KEY" "$R2_SECRET_ACCESS_KEY"
          check_secret "R2_BUCKET_NAME" "$R2_BUCKET_NAME"
          check_secret "R2_PUBLIC_URL" "$R2_PUBLIC_URL"
          check_secret "CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_ACCOUNT_ID"
          check_secret "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_API_TOKEN"
          check_secret "CF_ACCOUNT_ID" "$CF_ACCOUNT_ID"
          check_secret "CF_API_TOKEN" "$CF_API_TOKEN"
          check_secret "AWS_ACCESS_KEY_ID" "$AWS_ACCESS_KEY_ID"
          check_secret "AWS_SECRET_ACCESS_KEY" "$AWS_SECRET_ACCESS_KEY"
          check_secret "CLOUDFLARE_R2_ACCESS_KEY_ID" "$CLOUDFLARE_R2_ACCESS_KEY_ID"
          check_secret "CLOUDFLARE_R2_SECRET_ACCESS_KEY" "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          check_secret "R2_API_TOKEN" "$R2_API_TOKEN"
          check_secret "R2_TOKEN" "$R2_TOKEN"

          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2_UPLOAD_CREDENTIAL_SET_COMPLETE=true"
          else
            echo "R2_UPLOAD_CREDENTIAL_SET_COMPLETE=false"
          fi

          if { [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; } || { [ -n "$CF_ACCOUNT_ID" ] && [ -n "$CF_API_TOKEN" ]; }; then
            echo "CLOUDFLARE_API_CREDENTIAL_SET_COMPLETE=true"
          else
            echo "CLOUDFLARE_API_CREDENTIAL_SET_COMPLETE=false"
          fi

          if { [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; } || { [ -n "$CLOUDFLARE_R2_ACCESS_KEY_ID" ] && [ -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY" ]; }; then
            echo "R2_ALTERNATE_S3_CREDENTIAL_SET_COMPLETE=true"
          else
            echo "R2_ALTERNATE_S3_CREDENTIAL_SET_COMPLETE=false"
          fi

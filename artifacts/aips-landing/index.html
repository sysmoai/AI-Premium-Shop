<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>AI Premium Shop — 197 Premium AI Tools Bangladesh | From BDT 299</title>
    <meta name="description" content="197 premium AI tools (239 plans) in Bangladesh from BDT 299 to BDT 29,900. ChatGPT, Claude, Midjourney, Notion &amp; more. 5 Payment Methods: bKash, Nagad, Rocket, Bank, Binance. 5-30 min delivery. 10,000+ customers." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Premium Shop" />
    <meta property="og:locale" content="en_BD" />
    <meta property="og:image" content="https://aipremiumshop.com/images/og/default-og.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://aipremiumshop.com/images/og/default-og.png" />

    <!-- Hreflang for the homepage default (this file is the initial HTML for
         EVERY route, since vercel.json rewrites /(.*) to /index.html — it is
         what a crawler sees before JS executes, and what view-source and any
         non-JS-executing bot see always).
         Previously hreflang="bn" pointed at /faq — an English page — on
         every single URL on the site, because this static file is served
         everywhere and nothing overrode it for the 20+ pages that never
         call SEOHead with a hreflang prop. SEOHead removes and replaces
         these tags client-side, but only once React mounts.
         The homepage's real Bangla equivalent is /bn; this now states that
         correctly as the default, and SEOHead overrides it after mount for
         any page that has a different (or no) Bangla counterpart. -->
    <link rel="alternate" hreflang="en" href="https://aipremiumshop.com/" />
    <link rel="alternate" hreflang="bn" href="https://aipremiumshop.com/bn" />
    <link rel="alternate" hreflang="x-default" href="https://aipremiumshop.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0e27" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://wa.me" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
